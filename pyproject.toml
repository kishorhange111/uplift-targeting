[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upliftlab"
version = "0.1.0"
description = "Uplift modelling for email targeting on the Hillstrom randomised experiment: S, T, X and DR learners against response-model targeting, Qini evaluation with bootstrap intervals, budgets and an off-policy estimate of a per-customer email policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
keywords = ["uplift-modeling", "causal-inference", "cate", "qini", "hillstrom", "lightgbm", "ipw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "scikit-learn>=1.3,<2", "lightgbm>=4.0,<5"]

[project.urls]
Homepage = "https://github.com/kishorhange111/uplift-targeting"
Repository = "https://github.com/kishorhange111/uplift-targeting"
Issues = "https://github.com/kishorhange111/uplift-targeting/issues"

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.5,<3"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
upliftlab-run = "upliftlab.run:main"
upliftlab-serve = "upliftlab.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
